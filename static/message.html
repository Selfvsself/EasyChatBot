<!DOCTYPE html>
<html lang="en" class="sl-theme-dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/dark.css" />
    <script type="module"
            src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.js"></script>

    <style>
        html {
            font-size: 14px;
        }

        body {
            margin: 0;
            font-family: var(--sl-font-sans);
            background-color: var(--sl-color-neutral-0);
            display: flex;
            overflow: hidden;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            height: calc(var(--vh, 1vh) * 100);
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            padding: 12px;
            border-bottom: 1px solid var(--sl-color-neutral-200);
            font-weight: 600;
        }
        .app-header {
            display: flex;
            align-items: center;
            gap: 8px;

            padding: 10px 12px;
            border-bottom: 1px solid var(--sl-color-neutral-200);

            font-size: var(--sl-font-size-medium);
            font-weight: var(--sl-font-weight-semibold);
        }
        #profile-btn {
            max-width: 160px; /* можно 120–180 подобрать */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .profile-text {
            display: inline-block;
            max-width: 140px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-title-wrapper {
            flex: 1;
            text-align: center;
            overflow: hidden;
            margin-left: var(--sl-spacing-small);
        }

        #chat-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== ЧАТ ===== */
        .chat {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 12px 0;
            display: flex;
            overflow-y: auto;
            flex-direction: column;
            gap: 8px;
        }

        /* ===== СООБЩЕНИЕ ===== */
        .message {
            max-width: 75%;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message p {
            margin: 0 0 8px 0;
        }

        .message p:last-child {
            margin-bottom: 0;
        }

        .message h1,
        .message h2,
        .message h3 {
            margin: 10px 0 8px 0;
            line-height: 1.25;
        }

        .message h1 { font-size: 1.2rem; }
        .message h2 { font-size: 1.1rem; }
        .message h3 { font-size: 1rem; }

        .message blockquote {
            margin: 8px 0;
            padding: 6px 10px;
            border-left: 3px solid var(--sl-color-primary-500);
            background-color: rgba(0, 0, 0, 0.08);
            border-radius: 6px;
        }

        .message pre {
            margin: 8px 0;
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            background-color: rgba(0, 0, 0, 0.25);
            font-family: "Cascadia Code", "Fira Code", Consolas, monospace;
            font-size: 12px;
            line-height: 1.45;
        }

        .message code {
            font-family: "Cascadia Code", "Fira Code", Consolas, monospace;
            font-size: 0.92em;
            padding: 1px 4px;
            border-radius: 4px;
            background-color: rgba(0, 0, 0, 0.18);
        }

        .message pre code {
            background: none;
            padding: 0;
        }

        .message hr {
            border: 0;
            border-top: 1px solid var(--sl-color-neutral-400);
            margin: 10px 0;
        }

        .message.user {
            align-self: flex-end;
            background-color: #303030;
            color: #f5f5f5;
            border: 1px solid rgba(255, 255, 255, 0.08);
            max-width: min(72%, 760px);
            margin-right: clamp(12px, 4vw, 120px);
        }

        .message.assistant {
            align-self: stretch;
            width: 100%;
            max-width: 100%;
            background: transparent;
            border-radius: 0;
            padding: 8px clamp(12px, 4vw, 120px);
            box-sizing: border-box;
        }

        .message.assistant > * {
            max-width: 760px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ===== INPUT ===== */
        .input-area {
            padding: 10px 0;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
        }

        .input-area::before {
            content: "";
            display: block;
            width: min(calc(100% - 24px), 760px);
            margin: 0 auto 10px auto;
            border-top: 1px solid var(--sl-color-neutral-200);
        }

        .input-inner {
            width: min(calc(100% - 24px), 760px);
            margin: 0 auto;
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .bot-status {
            width: min(calc(100% - 24px), 760px);
            margin: 0 auto 8px auto;
            display: none;
            align-items: center;
            gap: 8px;
            color: var(--sl-color-neutral-600);
            font-size: 13px;
        }

        .bot-status.active {
            display: flex;
        }

        .typing-dots {
            display: inline-flex;
            gap: 2px;
            align-items: center;
        }

        .typing-dots span {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: var(--sl-color-neutral-500);
            opacity: 0.35;
            animation: pulse 1s infinite ease-in-out;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes pulse {
            0%, 80%, 100% {
                opacity: 0.35;
                transform: scale(1);
            }
            40% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        sl-textarea#input {
            flex: 1;
        }

        sl-textarea#input::part(textarea) {
            max-height: 120px;
            overflow-y: auto;
        }

        @media (max-width: 768px) {
            html {
                font-size: 18px;
            }
            .message h1 { font-size: 1.4rem; }
            .message h2 { font-size: 1.3rem; }
            .message h3 { font-size: 1.2rem; }

            .message pre {
                font-size: 14px;
            }

            .message code {
                font-size: 1.0em;
            }
        }

        sl-icon {
            flex-shrink: 0;
            font-size: 18px; /* фиксируем нормальный размер */
        }

    </style>
</head>
<body>
<div class="container">
    <div class="app-header">
        <sl-icon name="arrow-left" id="back-btn" style="cursor: pointer;"></sl-icon>

        <div class="chat-title-wrapper">
            <div id="chat-title"></div>
        </div>

        <sl-dropdown placement="bottom-end">
            <sl-button slot="trigger" variant="text" circle>
                <sl-icon name="person-circle"></sl-icon>
            </sl-button>

            <sl-menu>
            <sl-menu-item id="profile-btn">
                <sl-icon name="person" slot="prefix"></sl-icon>
                <span class="profile-text"></span>
            </sl-menu-item>

            <sl-divider></sl-divider>
                <sl-menu-item id="logout-btn" variant="danger">
                    <sl-icon name="box-arrow-right" slot="prefix"></sl-icon>
                    Выйти
                </sl-menu-item>
            </sl-menu>
        </sl-dropdown>
    </div>

    <div id="chat" class="chat"></div>

    <div class="input-area">
        <div id="bot-status" class="bot-status" aria-live="polite">
            <sl-icon id="bot-status-icon" name="cpu"></sl-icon>
            <span id="bot-status-text">Бот думает</span>
            <span class="typing-dots" aria-hidden="true"><span></span><span></span><span></span></span>
        </div>
        <div class="input-inner">
        <sl-textarea
            id="input"
            placeholder="Напишите сообщение..."
            rows="1"
            resize="auto"
            style="--size: 0; flex: 1;"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
        ></sl-textarea>
        <sl-button variant="primary" id="send-btn">Отправить</sl-button>
        </div>
    </div>
</div>

<script>
    const LOGIN_URL = "/web/login";
    const CHATS_URL = "/web/apps";
    const API_APPS = "/api/apps";
    const token = localStorage.getItem("token");

    if (!token) {
        window.location.href = LOGIN_URL;
    }

    const CURRENT_CHAT_ID = "{{ chat_id }}";
    const CURRENT_APP_ID = "{{ app_id }}";
    const CURRENT_APP_CODE = "{{ app_code }}";
    const CURRENT_APP_MODE = "{{ app_chat_mode }}";
    const rawName = "{{ chat_name }}";

    const CURRENT_CHAT_NAME =
        rawName && rawName !== "null" && rawName !== "undefined"
            ? rawName
            : "Чат";

    const chatTitle = document.getElementById("chat-title");
    chatTitle.innerText = CURRENT_CHAT_NAME;
    const rawUserName = localStorage.getItem("username");

    function truncate(text, maxLength = 20) {
        if (!text) return "Профиль";
        return text.length > maxLength
            ? text.slice(0, maxLength) + "..."
            : text;
    }

    const CURRENT_USER_NAME =
        rawUserName && rawUserName !== "null" && rawUserName !== "undefined"
            ? rawUserName
            : "Профиль";

    const profileText = document.querySelector(".profile-text");

    profileText.textContent = truncate(CURRENT_USER_NAME);
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send-btn");
    const botStatus = document.getElementById("bot-status");
    const botStatusText = document.getElementById("bot-status-text");
    const botStatusIcon = document.getElementById("bot-status-icon");

    const STATUS_MAP = {
        thinking: { text: "Бот думает", icon: "cpu" },
        searching: { text: "Поиск в интернете", icon: "globe2" },
        jira: { text: "Поиск в Jira", icon: "kanban" },
        tooling: { text: "Выполняю инструмент", icon: "tools" },
        typing: { text: "Бот печатает", icon: "keyboard" }
    };

    let assistantPending = false;

    function setBotStatus(state) {
        const config = STATUS_MAP[state];
        if (!config) return;

        botStatusText.textContent = config.text;
        botStatusIcon.name = config.icon;
        botStatus.classList.add("active");
    }

    function clearBotStatus() {
        assistantPending = false;
        botStatus.classList.remove("active");
    }

    function startAssistantStatusFlow() {
        assistantPending = true;
        setBotStatus("thinking");
    }

    function applyAgentStage(msg) {
        if (!assistantPending) {
            assistantPending = true;
        }

        const stage = msg.stage;
        if (stage === "thinking") {
            setBotStatus("thinking");
            return;
        }

        if (stage === "typing") {
            setBotStatus("typing");
            return;
        }

        if (stage === "tool_running") {
            const toolName = (msg.metadata?.tool || "").toLowerCase();
            if (toolName === "web_search") {
                setBotStatus("searching");
                return;
            }
            if (toolName === "jira_search") {
                setBotStatus("jira");
                return;
            }
            setBotStatus("tooling");
        }
    }

    const ws = new WebSocket(`ws://${location.host}${API_APPS}/${CURRENT_APP_ID}/chat/${CURRENT_CHAT_ID}/ws?token=${token}`);

    ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.event === "agent_stage") {
            applyAgentStage(msg);
            return;
        }

        addMessage(msg.role, msg.text);

        if (msg.role === "assistant") {
            clearBotStatus();
        }
    };

    ws.onerror = () => {
        clearBotStatus();
    };

    ws.onclose = () => {
        clearBotStatus();
    };

    loadHistory();

    async function loadHistory() {
        try {
            const res = await fetch(API_APPS + `/${CURRENT_APP_ID}/chat/${CURRENT_CHAT_ID}/history`, {
                headers: {
                    "Authorization": `Bearer ${token}`
                }
            });

            if (!res.ok) throw new Error('Ошибка загрузки истории');

            const data = await res.json();
            chat.innerHTML = '';

            data.messages.forEach(msg => {
                addMessage(msg.role, msg.text);
            });

        } catch (err) {
            console.error(err);
        }
    }

    async function send() {
        const text = input.value.trim();
        if (!text) return;

        startAssistantStatusFlow();

        try {
            const response = await fetch(API_APPS + `/${CURRENT_APP_ID}/chat/${CURRENT_CHAT_ID}/send`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({ text })
            });

            if (!response.ok) {
                clearBotStatus();
                return;
            }

            input.value = "";
        } catch (error) {
            clearBotStatus();
            console.error(error);
        }
    }

    function addMessage(role, text) {
        const div = document.createElement("div");
        div.className = `message ${role}`;
        div.innerHTML = renderMarkdown(text);

        chat.appendChild(div);

        // автоскролл вниз
        chat.scrollTop = chat.scrollHeight;
    }

    function escapeHtml(value) {
        return value
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#39;");
    }

    function parseInline(text) {
        return text
            .replace(/`([^`]+)`/g, "<code>$1</code>")
            .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
            .replace(/\*([^*]+)\*/g, "<em>$1</em>");
    }

    function renderMarkdown(rawText) {
        const src = escapeHtml(rawText || "");
        const codeBlocks = [];
        const textWithoutCode = src.replace(/```([\s\S]*?)```/g, (_, code) => {
            const token = `@@CODEBLOCK${codeBlocks.length}@@`;
            codeBlocks.push(`<pre><code>${code.trimEnd()}</code></pre>`);
            return token;
        });

        const lines = textWithoutCode.split(/\r?\n/);
        const html = [];
        let inList = false;

        for (const line of lines) {
            const trimmed = line.trim();

            if (!trimmed) {
                if (inList) {
                    html.push("</ul>");
                    inList = false;
                }
                continue;
            }

            if (/^@@CODEBLOCK\d+@@$/.test(trimmed)) {
                if (inList) {
                    html.push("</ul>");
                    inList = false;
                }
                html.push(trimmed);
                continue;
            }

            if (/^---+$/.test(trimmed)) {
                if (inList) {
                    html.push("</ul>");
                    inList = false;
                }
                html.push("<hr>");
                continue;
            }

            const headingMatch = trimmed.match(/^(#{1,3})\s+(.+)$/);
            if (headingMatch) {
                if (inList) {
                    html.push("</ul>");
                    inList = false;
                }
                const level = headingMatch[1].length;
                html.push(`<h${level}>${parseInline(headingMatch[2])}</h${level}>`);
                continue;
            }

            const quoteMatch = trimmed.match(/^>\s?(.*)$/);
            if (quoteMatch) {
                if (inList) {
                    html.push("</ul>");
                    inList = false;
                }
                html.push(`<blockquote>${parseInline(quoteMatch[1])}</blockquote>`);
                continue;
            }

            const listMatch = trimmed.match(/^[-*вЂўвЂ‘]\s+(.+)$/);
            if (listMatch) {
                if (!inList) {
                    html.push("<ul>");
                    inList = true;
                }
                html.push(`<li>${parseInline(listMatch[1])}</li>`);
                continue;
            }

            if (inList) {
                html.push("</ul>");
                inList = false;
            }
            html.push(`<p>${parseInline(trimmed)}</p>`);
        }

        if (inList) {
            html.push("</ul>");
        }

        let result = html.join("\n");
        codeBlocks.forEach((block, idx) => {
            result = result.replace(`@@CODEBLOCK${idx}@@`, block);
        });
        return result;
    }

    function setViewportHeight() {
        let vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
    }

    setViewportHeight();
    window.addEventListener('resize', setViewportHeight);

    sendBtn.addEventListener("click", send);

    input.addEventListener("sl-keydown", (event) => {
        if (event.key === "Enter") send();
    });
    document.getElementById("back-btn").onclick = () => {
    if (typeof CURRENT_APP_MODE !== 'undefined' && (CURRENT_APP_MODE === 'STATELESS') || (CURRENT_APP_MODE === 'SINGLE_CHAT')) {
        window.location.href = CHATS_URL;
    } else {
        window.location.href = CHATS_URL + `/${CURRENT_APP_ID}/chat`;
    }
    };
    async function handleLogout() {
    try {
        const res = await fetch("/api/auth/logout", {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${token}`
            }
        });

        if (res.ok) {
            localStorage.removeItem("token");
            localStorage.removeItem("username");

            window.location.href = LOGIN_URL;
        }
    } catch (error) {
        console.error("Ошибка при выходе:", error);
        localStorage.clear();
        window.location.href = LOGIN_URL;
    }
    }

    document.getElementById("logout-btn").addEventListener('click', handleLogout);
</script>
</body>
</html>
